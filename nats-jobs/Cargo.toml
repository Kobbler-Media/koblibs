[package]
name = "nats-jobs"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Shared NATS JetStream job system for Kobbler and Kobload"
license = "AGPL-3.0-only"

[dependencies]
# NATS
async-nats = "0.51.0"

# Async runtime
tokio = { version = "1.54.1", features = ["full"] }
futures = "0.3.34"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Database
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros", "uuid", "json", "time"] }

# Time
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
chrono = { version = "0.4.45", features = ["serde"] }

# Utilities
uuid = { version = "1.29.0", features = ["v4", "serde"] }
tracing = "0.1.44"
thiserror = "2.0.21"
async-trait = "0.1.92"
tokio-util = "0.7.20"
dashmap = "6.2.1"

# Optional: OpenAPI schema generation
utoipa = { version = "6.0.0", optional = true, features = ["uuid", "time"] }

[features]
default = []
openapi = ["utoipa"]

[dev-dependencies]
nkeys = "0.4.5"
