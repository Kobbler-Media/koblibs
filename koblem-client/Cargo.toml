[package]
name = "koblem-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "HTTP client for koblem (local LLM service)"
license = "AGPL-3.0-only"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["serde", "v4"] }
nats-jobs = { path = "../nats-jobs" }
