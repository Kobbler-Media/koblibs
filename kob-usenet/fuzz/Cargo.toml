[package]
name = "kob-usenet-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
kob-usenet = { path = ".." }
libfuzzer-sys = "0.4.13"
tokio = { version = "1", features = ["io-util", "net", "rt", "time"] }

[[bin]]
name = "nzb_parse"
path = "fuzz_targets/nzb_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive_headers"
path = "fuzz_targets/archive_headers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "yenc_decode"
path = "fuzz_targets/yenc_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "par2_packets"
path = "fuzz_targets/par2_packets.rs"
test = false
doc = false
bench = false

[[bin]]
name = "blob_meta"
path = "fuzz_targets/blob_meta.rs"
test = false
doc = false
bench = false
