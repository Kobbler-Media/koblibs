[package]
name = "kob-providers"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Provider traits for koblem service integrations"
license = "AGPL-3.0-only"

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time"] }
tracing = "0.1.44"
