[package]
name = "kob-gpu-gate"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Priority-based GPU lock for TTS/STT/vision services sharing a single GPU"
license = "AGPL-3.0-only"

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "rt-multi-thread", "macros", "io-util", "net"] }
