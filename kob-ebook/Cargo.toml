[package]
name = "kob-ebook"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Native ebook conversion: source formats -> EPUB via boko, EPUB -> KEPUB via in-process koboSpan injection"
license = "AGPL-3.0-only"

[dependencies]
# Fork of zacharydenton/boko: upstream 0.6.0 plus the CFI source map reader
# packs locate text with (Chapter::text_cfi / resolve_cfi), case-insensitive
# spine resolution, and the cascade reader packs need for book styling
# (::first-letter dropcaps, vertical-align lengths, the browser's hr border,
# background images), none of which upstream has.
#
# Drop the fork once upstream ships all of it.
boko = { git = "https://github.com/tinyfiddler/boko", rev = "66d8bbc91610bf5b1305346f1b80ee92536f8cd4", default-features = false }
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2"] }
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
